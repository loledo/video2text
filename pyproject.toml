[tool.poetry]
name = "video2text"
version = "0.1.0"
description = "Local video-to-text transcription tool powered by Hugging Face Whisper models"
authors = ["LOURENCO LEDO <thoughtworks.ledo@mbusa.com>"]
readme = "README.md"

[tool.poetry.scripts]
transcribe = "transcribe:main"

[tool.poetry.dependencies]
python = "^3.11"
transformers = ">=4.40.0"
torch = ">=2.2.0"
torchaudio = ">=2.2.0"
accelerate = ">=0.30.0"
soundfile = ">=0.12.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
